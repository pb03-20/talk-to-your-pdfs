<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk to Your PDFs</title>
    <meta name="description" content="Upload multiple PDFs, search and chat with grounded citations, and have live voice conversations with Gemini." />
    <meta property="og:title" content="Talk to Your PDFs" />
    <meta property="og:description" content="Upload multiple PDFs, search and chat with grounded citations, and have live voice conversations with Gemini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <script>
      // Apply the saved theme before first paint. Without this the page
      // renders in the default theme for a frame and then snaps over.
      try {
        var t = localStorage.getItem("pdf_rag_theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
