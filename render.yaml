services:
  - type: web
    name: talk-to-your-pdfs
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: rag_database
      - key: MONGODB_VECTOR_COLLECTION
        value: document_chunks
      - key: MONGODB_VECTOR_INDEX
        value: vector_index
